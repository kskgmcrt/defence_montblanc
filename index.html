<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}html,body{height:100%}body{margin:0;font:14px system-ui;background:#F3C89B}img{max-width:100%}[hidden]{display:none!important}</style>
<title>むき栗ディフェンス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --cream:#FFF6E8;
  --cream-2:#FFEBD2;
  --tart:#E3AE6B;
  --crust:#C98B4B;
  --marron:#B9762F;
  --chestnut:#6B4226;
  --maple:#D1502E;
  --pumpkin:#F0A03C;
  --plum:#57384A;
  --ink:#4A2B1E;
  --leaf:#8FA84E;
  --ui-panel:rgba(255,246,232,.86);
  --ui-panel-solid:#FFF6E8;
  --ui-edge:rgba(107,66,38,.18);
  --shadow-soft:0 10px 24px rgba(87,56,74,.22), 0 2px 0 rgba(255,255,255,.7) inset;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#F3C89B;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  user-select:none;
}
#stage{position:fixed;inset:0;display:block}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- HUD ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 14px);
  display:grid;grid-template-rows:auto 1fr auto;gap:8px;
}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:nowrap}

.panel{
  background:var(--ui-panel);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-soft);
  border:1.5px solid rgba(255,255,255,.75);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

/* Mont Blanc health */
#mbBox{padding:9px 14px 10px;display:flex;align-items:center;gap:11px;min-width:min(52vw,300px)}
#mbIcon{width:34px;height:34px;flex:0 0 auto}
.mbLabel{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--marron);line-height:1}
.barWrap{flex:1;min-width:90px}
.bar{height:13px;border-radius:99px;background:rgba(107,66,38,.15);overflow:hidden;margin-top:5px;box-shadow:inset 0 2px 3px rgba(87,56,74,.18)}
.bar > i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(180deg,#FFDCA0,#E8A64C 55%,#C9812F);
  box-shadow:0 0 0 1px rgba(107,66,38,.12) inset;
  transition:width .22s cubic-bezier(.3,1.2,.5,1);}
.bar.low > i{background:linear-gradient(180deg,#FFB3A0,#E3603C 55%,#B93A22)}

/* score */
#scoreBox{padding:8px 15px 10px;text-align:right}
#waveTag{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--maple)}
#score{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:27px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
#combo{font-size:12px;font-weight:700;color:var(--pumpkin);height:15px}

/* bottom left status */
#statusBox{padding:9px 14px 11px;display:flex;flex-direction:column;gap:7px}
#hearts{display:flex;gap:5px}
#hearts span{width:19px;height:19px;display:block;transition:transform .2s}
#hearts span.gone{opacity:.24;transform:scale(.72)}
#ammo{display:flex;gap:4px;align-items:center}
#ammo b{font-size:10px;letter-spacing:.12em;color:var(--marron);margin-right:3px;font-weight:700}
#ammo i{width:13px;height:16px;display:block;background:no-repeat center/contain;transition:opacity .15s,transform .15s}
#ammo i.off{opacity:.2;transform:scale(.75)}

/* buttons */
.btns{display:flex;gap:8px;pointer-events:auto}
.iconBtn{
  width:42px;height:42px;border-radius:15px;border:1.5px solid rgba(255,255,255,.8);
  background:var(--ui-panel);box-shadow:var(--shadow-soft);cursor:pointer;
  display:grid;place-items:center;padding:0;color:var(--marron);
  font-size:17px;transition:transform .12s ease, background .15s;
}
.iconBtn:hover{transform:translateY(-2px)}
.iconBtn:active{transform:translateY(1px) scale(.96)}
.iconBtn:focus-visible{outline:3px solid var(--pumpkin);outline-offset:2px}
.iconBtn.off{color:rgba(107,66,38,.34)}

/* wave banner */
#banner{
  grid-row:2;align-self:center;justify-self:center;text-align:center;
  font-family:"Mochiy Pop One",system-ui,sans-serif;
  color:var(--cream);opacity:0;transform:scale(.7);
  text-shadow:0 5px 0 #B9762F, 0 8px 18px rgba(87,56,74,.4);
  letter-spacing:.06em;
}
#banner .big{font-size:clamp(34px,9vw,68px);line-height:1}
#banner .sub{font-size:clamp(12px,2.6vw,17px);margin-top:8px;letter-spacing:.24em;color:#FFE7C4;text-shadow:0 3px 0 #B9762F}
#banner.show{animation:bannerPop 2.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bannerPop{
  0%{opacity:0;transform:scale(.55) rotate(-4deg)}
  14%{opacity:1;transform:scale(1.08) rotate(1.5deg)}
  24%{transform:scale(1) rotate(0)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.12) translateY(-18px)}
}

/* touch controls */
#touchUI{position:fixed;inset:0;z-index:9;display:none;pointer-events:none}
body.touch #touchUI{display:block}
#stickBase,#stickKnob{position:absolute;border-radius:50%;opacity:0;transition:opacity .18s;will-change:transform}
#stickBase{width:118px;height:118px;margin:-59px 0 0 -59px;background:rgba(255,246,232,.34);border:2.5px solid rgba(255,246,232,.72);box-shadow:0 6px 18px rgba(87,56,74,.2)}
#stickKnob{width:54px;height:54px;margin:-27px 0 0 -27px;background:rgba(255,246,232,.92);box-shadow:0 5px 12px rgba(87,56,74,.3)}
#throwHint{position:absolute;right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);
  width:96px;height:96px;border-radius:50%;background:rgba(255,246,232,.3);border:2.5px dashed rgba(255,246,232,.7);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:#7A4B22;letter-spacing:.1em;text-align:center;line-height:1.5}

/* charge ring */
#chargeRing{position:fixed;z-index:9;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;opacity:0;transition:opacity .12s}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:radial-gradient(120% 90% at 50% 12%, rgba(255,214,165,.55), rgba(87,56,74,.62));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.overlay[hidden]{display:none}
.card{
  width:min(480px,100%);max-height:100%;overflow:auto;
  background:linear-gradient(180deg,#FFFBF3,#FFF0DA);
  border-radius:30px;padding:26px 24px 24px;text-align:center;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 22px 50px rgba(87,56,74,.35), 0 3px 0 rgba(255,255,255,.9) inset;
}
.kicker{font-size:11px;letter-spacing:.34em;color:var(--marron);font-weight:700;margin-bottom:10px}
h1{
  font-family:"Mochiy Pop One",system-ui,sans-serif;font-weight:400;
  font-size:clamp(32px,8.4vw,50px);line-height:1.12;margin:0;color:var(--maple);
  text-shadow:0 4px 0 #F6D9A8, 0 6px 0 rgba(201,139,75,.45);
  text-wrap:balance;
}
h1 em{font-style:normal;color:var(--marron);display:block;font-size:.62em;margin-top:6px;text-shadow:0 3px 0 #F6D9A8}
.lede{font-size:14px;line-height:1.85;color:#6B4226;margin:16px 2px 0;text-wrap:pretty}
.keys{display:grid;gap:9px;margin:20px 0 4px;text-align:left}
.keyrow{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.66);border:1.5px solid rgba(201,139,75,.2);border-radius:var(--r-md);padding:9px 13px}
.keyrow .k{display:flex;gap:4px;flex:0 0 auto}
.keyrow kbd{
  font-family:"Fredoka",system-ui,sans-serif;font-size:12px;font-weight:600;
  background:#FFF;border:1.5px solid rgba(107,66,38,.22);border-bottom-width:3px;
  border-radius:8px;padding:3px 7px;min-width:26px;text-align:center;color:var(--chestnut);
}
.keyrow p{margin:0;font-size:13px;font-weight:700;color:#6B4226;line-height:1.4}
.keyrow p small{display:block;font-weight:500;font-size:11.5px;color:rgba(107,66,38,.68);letter-spacing:.02em}
.btn{
  pointer-events:auto;margin-top:20px;width:100%;
  font-family:"Mochiy Pop One",system-ui,sans-serif;font-size:20px;letter-spacing:.08em;
  color:#FFF8EC;background:linear-gradient(180deg,#F2853C,#D9552C);
  border:none;border-radius:20px;padding:15px 20px 17px;cursor:pointer;
  box-shadow:0 6px 0 #A83C1D, 0 14px 26px rgba(168,60,29,.35), 0 2px 0 rgba(255,255,255,.4) inset;
  transition:transform .1s ease, box-shadow .1s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #A83C1D,0 18px 30px rgba(168,60,29,.38),0 2px 0 rgba(255,255,255,.4) inset}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #A83C1D,0 6px 14px rgba(168,60,29,.3),0 2px 0 rgba(255,255,255,.4) inset}
.btn:focus-visible{outline:3px solid #7A4B22;outline-offset:3px}
.btn.ghost{background:linear-gradient(180deg,#FFF3E0,#F6DFBE);color:var(--chestnut);box-shadow:0 5px 0 #C99C63,0 10px 20px rgba(107,66,38,.22);font-size:16px;margin-top:10px}
.btn.ghost:active{box-shadow:0 1px 0 #C99C63,0 5px 12px rgba(107,66,38,.2)}

.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.stat{background:rgba(255,255,255,.7);border:1.5px solid rgba(201,139,75,.22);border-radius:var(--r-md);padding:11px 6px 12px}
.stat b{display:block;font-family:"Fredoka",system-ui,sans-serif;font-size:24px;font-weight:700;color:var(--maple);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:10px;letter-spacing:.14em;color:var(--marron);font-weight:700}
.best{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--marron);letter-spacing:.06em}

#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(180deg,#FFE7C4,#F7C08E)}
#loading p{font-family:"Mochiy Pop One",system-ui,sans-serif;color:#B9762F;font-size:16px;letter-spacing:.2em;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

@media (max-width:430px){
  #mbBox{min-width:0;flex:1;padding:8px 11px 9px;gap:8px}
  #mbIcon{width:28px;height:28px}
  #score{font-size:22px}
  #scoreBox{padding:7px 11px 8px}
  .iconBtn{width:38px;height:38px;border-radius:13px}
  #statusBox{padding:8px 11px 9px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  #banner.show{opacity:1;transform:none;animation:none}
}
</style>

</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="ui">
  <div class="row">
    <div class="panel" id="mbBox">
      <svg id="mbIcon" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="34" rx="15" ry="4" fill="#E8C79A"/>
        <path d="M20 5c-7 0-13 12-14 24h28C33 17 27 5 20 5z" fill="#D9A05B"/>
        <path d="M20 5c-3.4 0-6.6 2.9-9 7.6 2.1 1.3 3.4 4 3.4 7.4 0 3-1 5.6-2.6 7.1 1.9 1.3 3.2 3.9 3.2 6.9h9.9C25 17.6 23.6 5 20 5z" fill="#C4873E" opacity=".55"/>
        <circle cx="20" cy="6" r="4.4" fill="#8B5A2B"/>
        <path d="M20 1.8c2.4 0 4.4 1.9 4.4 4.2-2.6-1-6.2-1-8.8 0 0-2.3 2-4.2 4.4-4.2z" fill="#F3E2C2"/>
      </svg>
      <div class="barWrap">
        <div class="mbLabel">MONT BLANC</div>
        <div class="bar" id="mbBar"><i style="width:100%"></i></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="panel" id="scoreBox">
        <div id="waveTag">WAVE 1</div>
        <div id="score">0</div>
        <div id="combo"></div>
      </div>
      <div class="btns">
        <button class="iconBtn" id="btnSound" title="サウンド" aria-label="サウンド切り替え">♪</button>
        <button class="iconBtn" id="btnPause" title="ポーズ" aria-label="ポーズ">❚❚</button>
      </div>
    </div>
  </div>

  <div id="banner" aria-live="polite"><div class="big"></div><div class="sub"></div></div>

  <div class="row" style="align-items:flex-end">
    <div class="panel" id="statusBox">
      <div id="hearts"></div>
      <div id="ammo"><b>KURI</b></div>
    </div>
    <div></div>
  </div>
</div>

<div id="touchUI">
  <div id="stickBase"></div>
  <div id="stickKnob"></div>
  <div id="throwHint">ここを<br>長押しで<br>なげる</div>
</div>
<svg id="chargeRing" viewBox="0 0 70 70" aria-hidden="true">
  <circle cx="35" cy="35" r="30" fill="none" stroke="rgba(255,246,232,.45)" stroke-width="6"/>
  <circle id="chargeArc" cx="35" cy="35" r="30" fill="none" stroke="#F2853C" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 35 35)"/>
</svg>

<div class="overlay" id="titleScreen">
  <div class="card">
    <div class="kicker">AUTUMN SWEETS DEFENSE</div>
    <h1>むき栗ディフェンス<em>〜モンブランを守れ〜</em></h1>
    <p class="lede">秋のお菓子の国。まんなかの大きなモンブランを、<br>おかしな秋の住人たちがねらっています。<br><b>むき栗</b>を投げて、モンブランを守りきろう。</p>
    <div class="keys" id="keyHelp"></div>
    <button class="btn" id="btnStart">ゲームスタート</button>
    <div class="best" id="bestTitle"></div>
  </div>
</div>

<div class="overlay" id="overScreen" hidden>
  <div class="card">
    <div class="kicker" id="overKicker">GAME OVER</div>
    <h1 id="overTitle">モンブラン、<em>くずれちゃった…</em></h1>
    <div class="statGrid">
      <div class="stat"><b id="stWave">1</b><span>WAVE</span></div>
      <div class="stat"><b id="stKill">0</b><span>たおした</span></div>
      <div class="stat"><b id="stScore">0</b><span>SCORE</span></div>
    </div>
    <div class="best" id="bestOver"></div>
    <button class="btn" id="btnRetry">もういちど</button>
    <button class="btn ghost" id="btnTitle">タイトルへ</button>
  </div>
</div>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <div class="kicker">PAUSE</div>
    <h1>ひとやすみ<em>栗をひろっています</em></h1>
    <button class="btn" id="btnResume">つづける</button>
    <button class="btn ghost" id="btnQuit">タイトルへ</button>
  </div>
</div>

<div id="loading"><p>おかしの国を やいています…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
addEventListener('error',function(ev){
  const l=document.getElementById('loading');
  if(l) l.innerHTML='<p style="max-width:86vw;text-align:center;line-height:1.8">よみこみエラー<br>'+
    '<span style="font-size:11px;font-family:ui-monospace,monospace;letter-spacing:0">'+String(ev.message||ev.type)+'</span></p>';
});
if(!window.THREE){
  document.getElementById('loading').innerHTML='<p style="text-align:center;line-height:1.8">3Dライブラリを<br>よみこめませんでした<br><span style="font-size:11px">ネットワークをご確認ください</span></p>';
  return;
}

/* ============================================================
   0. helpers
   ============================================================ */
const TAU=Math.PI*2, clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = h => new THREE.Color(h).convertSRGBToLinear();
function M(hex,rough,opts){
  return new THREE.MeshStandardMaterial(Object.assign({
    color:C(hex), roughness:rough===undefined?.78:rough, metalness:0
  },opts||{}));
}
function lathePts(arr){ return arr.map(p=>new THREE.Vector2(p[0],p[1])); }
function lathe(arr,seg){ return new THREE.LatheGeometry(lathePts(arr), seg||22); }

/* merge a list of {geo, matrix} that share one material into a single geometry */
function mergeGeos(items){
  let total=0; const parts=[];
  for(const it of items){
    let g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    if(it.matrix) g.applyMatrix4(it.matrix);
    total += g.attributes.position.count; parts.push(g);
  }
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2);
  let o=0;
  for(const g of parts){
    pos.set(g.attributes.position.array,o*3);
    if(g.attributes.normal) nor.set(g.attributes.normal.array,o*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array,o*2);
    o+=g.attributes.position.count;
    g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  out.computeBoundingSphere();
  return out;
}
const MX=new THREE.Matrix4(), QQ=new THREE.Quaternion(), V3=new THREE.Vector3(), EU=new THREE.Euler();
function mtx(px,py,pz,rx,ry,rz,sx,sy,sz){
  EU.set(rx||0,ry||0,rz||0);
  QQ.setFromEuler(EU);
  return new THREE.Matrix4().compose(
    new THREE.Vector3(px||0,py||0,pz||0), QQ,
    new THREE.Vector3(sx===undefined?1:sx, sy===undefined?(sx===undefined?1:sx):sy, sz===undefined?(sx===undefined?1:sx):sz));
}

/* ============================================================
   1. renderer / scene / camera
   ============================================================ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const SMALL = Math.min(innerWidth,innerHeight) < 560;
renderer.setPixelRatio(Math.min(devicePixelRatio||1, SMALL?1.75:2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.LinearToneMapping;
renderer.toneMappingExposure=1.02;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(C('#FFD5A8'), 60, 132);

const camera=new THREE.PerspectiveCamera(34,1,0.5,300);
const CAM_DIR=new THREE.Vector3(0,.735,.678).normalize();
const camTarget=new THREE.Vector3(0,2.0,0);
let camDist=46;

function fitCamera(){
  const w=innerWidth,h=innerHeight,asp=w/h;
  camera.aspect=asp;
  const halfV=Math.tan(camera.fov*Math.PI/360);
  const needH = 27, needW = 36;            // world units that must stay visible
  const dV=(needH/2)/halfV, dH=(needW/2)/(halfV*asp);
  camDist=clamp(Math.max(dV,dH),34,86);
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
addEventListener('resize',fitCamera);

/* ============================================================
   2. lighting
   ============================================================ */
scene.add(new THREE.HemisphereLight(C('#FFE3BE'), C('#C98A62'), .62));
scene.add(new THREE.AmbientLight(C('#FFE8D4'), .22));

const sun=new THREE.DirectionalLight(C('#FFF0D2'), 1.22);
sun.position.set(15,24,11);
sun.castShadow=true;
sun.shadow.mapSize.set(SMALL?1024:2048, SMALL?1024:2048);
const sc=sun.shadow.camera;
sc.left=-20; sc.right=20; sc.top=20; sc.bottom=-20; sc.near=8; sc.far=64;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.05; sun.shadow.radius=2.4;
scene.add(sun); scene.add(sun.target);

const rim=new THREE.DirectionalLight(C('#B9CCF5'), .34);
rim.position.set(-14,9,-16); scene.add(rim);

const warm=new THREE.PointLight(C('#FFB86B'), .5, 40, 2);
warm.position.set(0,7,0); scene.add(warm);

/* ============================================================
   3. sky + clouds + far scenery
   ============================================================ */
(function buildSky(){
  const g=new THREE.SphereGeometry(140,28,20);
  const m=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{
      top:{value:C('#F2A98F')}, mid:{value:C('#FFD9A2')}, bot:{value:C('#FFF0D8')}
    },
    vertexShader:'varying float vY; void main(){ vY=normalize(position).y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:[
      'varying float vY; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
      'void main(){ float y=clamp(vY*0.5+0.5,0.0,1.0);',
      ' vec3 c = mix(bot, mid, smoothstep(0.34,0.58,y));',
      ' c = mix(c, top, smoothstep(0.58,0.92,y));',
      ' gl_FragColor=vec4(c,1.0);}'
    ].join('\n')
  });
  scene.add(new THREE.Mesh(g,m));
})();

const cloudMat=M('#FFF6EC',1,{fog:false});
const cloudMatPink=M('#FFD9C4',1,{fog:false});
const clouds=[];
(function buildClouds(){
  const sphere=new THREE.SphereGeometry(1,12,9);
  for(let i=0;i<13;i++){
    const g=new THREE.Group();
    const n=rint(3,5);
    for(let j=0;j<n;j++){
      const s=rnd(1.9,3.6);
      const m=new THREE.Mesh(sphere, j%2?cloudMatPink:cloudMat);
      m.position.set(rnd(-4,4), rnd(-.5,.7), rnd(-1.6,1.6));
      m.scale.set(s,s*rnd(.55,.75),s*rnd(.8,1));
      g.add(m);
    }
    const a=rnd(0,TAU), r=rnd(42,88);
    g.position.set(Math.cos(a)*r, rnd(12,30), Math.sin(a)*r);
    g.userData.spin=rnd(.004,.012)*(Math.random()<.5?-1:1);
    g.userData.bob=rnd(0,TAU);
    clouds.push(g); scene.add(g);
  }
})();

/* far candy trees + floating donuts */
(function buildScenery(){
  const trunkGeo=new THREE.CylinderGeometry(.45,.7,3.2,8);
  const trunkMat=M('#8A5A3A',.9);
  const foliMat=[M('#D9502E',.85),M('#EE9A3E',.85),M('#E9C84A',.85),M('#B9422E',.85)];
  const ball=new THREE.SphereGeometry(1,11,9);
  for(let i=0;i<26;i++){
    const a=(i/26)*TAU+rnd(-.1,.1), r=rnd(23,42);
    const g=new THREE.Group();
    const t=new THREE.Mesh(trunkGeo,trunkMat); t.position.y=1.6; g.add(t);
    const mt=pick(foliMat);
    for(let j=0;j<3;j++){
      const s=rnd(1.7,2.9);
      const b=new THREE.Mesh(ball,mt);
      b.position.set(rnd(-1.1,1.1),rnd(3.4,5.2),rnd(-1.1,1.1));
      b.scale.set(s,s*.85,s); g.add(b);
    }
    const sc2=rnd(.8,1.45);
    g.scale.setScalar(sc2);
    g.position.set(Math.cos(a)*r, -1.6, Math.sin(a)*r);
    scene.add(g);
  }
  // floating donuts far away
  const dGeo=new THREE.TorusGeometry(1.6,.72,10,20);
  const icing=[M('#F6A6C1',.6),M('#C58A5A',.6),M('#EFD07A',.6)];
  for(let i=0;i<7;i++){
    const d=new THREE.Mesh(dGeo,pick(icing));
    const a=rnd(0,TAU), r=rnd(30,55);
    d.position.set(Math.cos(a)*r, rnd(8,20), Math.sin(a)*r);
    d.rotation.set(rnd(0,1),rnd(0,TAU),rnd(-.4,.4));
    d.userData.f=rnd(0,TAU);
    clouds.push(d); d.userData.spin=rnd(.002,.008);
    scene.add(d);
  }
  // tablecloth
  const texC=document.createElement('canvas'); texC.width=texC.height=256;
  const cx=texC.getContext('2d');
  cx.fillStyle='#C9603F'; cx.fillRect(0,0,256,256);
  cx.fillStyle='rgba(255,236,206,.55)';
  for(let i=0;i<8;i++){ cx.fillRect(i*32,0,16,256); }
  cx.globalCompositeOperation='overlay';
  cx.fillStyle='rgba(255,236,206,.55)';
  for(let i=0;i<8;i++){ cx.fillRect(0,i*32,256,16); }
  const tex=new THREE.CanvasTexture(texC);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(7,7); tex.encoding=THREE.sRGBEncoding;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const cloth=new THREE.Mesh(new THREE.CircleGeometry(75,48), new THREE.MeshStandardMaterial({map:tex,roughness:.95,metalness:0}));
  cloth.rotation.x=-Math.PI/2; cloth.position.y=-3.6; cloth.receiveShadow=true;
  scene.add(cloth);
})();

/* ============================================================
   4. the stage — a giant tart
   ============================================================ */
const STAGE_R=15.4, PLAY_R=14.3, MB_R=3.75;

const world=new THREE.Group(); scene.add(world);
(function buildStage(){
  // porcelain plate
  const plate=new THREE.Mesh(lathe([[0,-2.9],[STAGE_R+2.4,-2.9],[STAGE_R+3.1,-2.35],[STAGE_R+3.25,-1.75],[STAGE_R+2.5,-1.95],[STAGE_R-1,-2.15],[0,-2.2]],64), M('#FFFCF5',.35,{side:THREE.DoubleSide}));
  plate.receiveShadow=true; world.add(plate);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(STAGE_R+3.0,.16,8,72), M('#E3A6BC',.5));
  ring.rotation.x=Math.PI/2; ring.position.y=-1.86; world.add(ring);

  // tart body — its top cap is tucked BELOW the cream disc so no two
  // surfaces ever share a height (that coplanar pair was the flicker)
  const body=new THREE.Mesh(new THREE.CylinderGeometry(STAGE_R,STAGE_R-.9,1.95,64,1,false), M('#DFA463',.92));
  body.position.y=-1.52; body.castShadow=true; body.receiveShadow=true; world.add(body);

  // cream top surface with sugar speckle texture
  const tc=document.createElement('canvas'); tc.width=tc.height=512;
  const g2=tc.getContext('2d');
  const grd=g2.createRadialGradient(256,256,30,256,256,256);
  grd.addColorStop(0,'#FFF8EC'); grd.addColorStop(.72,'#FFEFD8'); grd.addColorStop(1,'#F7DFBC');
  g2.fillStyle=grd; g2.fillRect(0,0,512,512);
  // low-contrast, chunky speckle — fine high-frequency noise shimmers when the camera moves
  for(let i=0;i<820;i++){
    g2.fillStyle=Math.random()<.5?'rgba(255,255,255,.26)':'rgba(214,168,116,.13)';
    const r=1.3+Math.random()*2.4;
    g2.beginPath(); g2.arc(Math.random()*512,Math.random()*512,r,0,TAU); g2.fill();
  }
  const topTex=new THREE.CanvasTexture(tc); topTex.encoding=THREE.sRGBEncoding;
  topTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const top=new THREE.Mesh(new THREE.CylinderGeometry(STAGE_R-.55,STAGE_R-.55,.62,64),
    new THREE.MeshStandardMaterial({map:topTex,roughness:.72,metalness:0}));
  top.position.y=-.31; top.receiveShadow=true; world.add(top);

  // scalloped crust
  const scallop=new THREE.SphereGeometry(1,11,8);
  const items=[];
  const N=46;
  for(let i=0;i<N;i++){
    const a=(i/N)*TAU;
    items.push({geo:scallop, matrix:mtx(Math.cos(a)*(STAGE_R-.45),.04,Math.sin(a)*(STAGE_R-.45),0,-a,0,1.02,.9,1.35)});
  }
  const crust=new THREE.Mesh(mergeGeos(items), M('#D89A50',.88));
  crust.castShadow=true; crust.receiveShadow=true; world.add(crust);

  // icing swirl line + sprinkles + berries (flat decorations)
  const deco=[];
  const berry=new THREE.SphereGeometry(.26,9,7);
  const sprinkle=new THREE.CylinderGeometry(.055,.055,.34,6);
  const berryItems=[], sprinkleItems=[];
  for(let i=0;i<40;i++){
    const a=rnd(0,TAU), r=rnd(MB_R+1.9,STAGE_R-1.4);
    berryItems.push({geo:berry,matrix:mtx(Math.cos(a)*r,.06,Math.sin(a)*r,0,0,0,1,.72,1)});
  }
  for(let i=0;i<110;i++){
    const a=rnd(0,TAU), r=rnd(MB_R+1.2,STAGE_R-.9);
    sprinkleItems.push({geo:sprinkle,matrix:mtx(Math.cos(a)*r,.05,Math.sin(a)*r,Math.PI/2,rnd(0,TAU),0,1)});
  }
  const b1=new THREE.Mesh(mergeGeos(berryItems), M('#C93B4E',.5)); b1.receiveShadow=true; b1.castShadow=true; world.add(b1);
  const s1=new THREE.Mesh(mergeGeos(sprinkleItems), M('#F7E7C0',.6)); world.add(s1);

  // icing circle
  const icing=new THREE.Mesh(new THREE.TorusGeometry(STAGE_R-2.6,.13,7,90), M('#FFFDF6',.5));
  icing.rotation.x=Math.PI/2; icing.position.y=.06; world.add(icing);
  const icing2=new THREE.Mesh(new THREE.TorusGeometry(MB_R+1.35,.11,7,70), M('#E9A4B8',.5));
  icing2.rotation.x=Math.PI/2; icing2.position.y=.06; world.add(icing2);

  // macarons around the edge
  const macMats=[M('#F3AEC2',.6),M('#C9E3A0',.6),M('#F6D57A',.6),M('#C7A8E0',.6)];
  const shellG=lathe([[0,0],[.42,.02],[.52,.14],[.5,.3],[.3,.38],[0,.4]],16);
  for(let i=0;i<14;i++){
    const a=(i/14)*TAU+.11, r=STAGE_R-2.0;
    const g=new THREE.Group();
    const mm=macMats[i%macMats.length];
    const s1b=new THREE.Mesh(shellG,mm); s1b.position.y=.46; s1b.rotation.z=Math.PI; s1b.castShadow=true;
    const s2b=new THREE.Mesh(shellG,mm); s2b.position.y=.46; s2b.castShadow=true;
    const fill=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.16,14), M('#C4763F',.7)); fill.position.y=.46;
    g.add(s1b,s2b,fill);
    g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    g.rotation.y=rnd(0,TAU);
    world.add(g);
  }
})();

const montblanc=new THREE.Group(); montblanc.position.y=0; world.add(montblanc);
const mbCreamMats=[];
let mbTopGroup=null, mbCrown=null;

function chestnutGeo(){
  // peeled chestnut: flat-ish bottom, plump body, soft point on top
  return lathe([
    [0,0],[.30,0],[.40,.06],[.46,.20],[.47,.40],[.42,.60],[.30,.76],[.15,.86],[0,.90]
  ],18);
}
const KURI_GEO=chestnutGeo();
const KURI_MAT=M('#F3DCA8',.62);
const KURI_MAT_BIG=M('#FFE9B8',.5,{emissive:C('#8A5A18'),emissiveIntensity:.35});

/* maple-ish leaf shape — declared before anything that builds one */
let LEAF_GEO=null;
const leafMats={};
function leafGeometry(){
  if(LEAF_GEO) return LEAF_GEO;
  const shape=new THREE.Shape();
  const N=110;
  for(let i=0;i<=N;i++){
    const t=i/N, a=t*TAU-Math.PI/2;
    let r=.62+.30*Math.cos(5*a)+.10*Math.cos(10*a);
    r*= (1-0.18*Math.cos(a));
    const x=Math.cos(a)*r, y=Math.sin(a)*r*1.06;
    if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  LEAF_GEO=new THREE.ExtrudeGeometry(shape,{depth:.045,bevelEnabled:true,bevelSize:.03,bevelThickness:.025,bevelSegments:1,curveSegments:1});
  LEAF_GEO.center();
  return LEAF_GEO;
}
function makeLeafMesh(hex){
  if(!leafMats[hex]) leafMats[hex]=M(hex,.8,{side:THREE.DoubleSide});
  const m=new THREE.Mesh(leafGeometry(),leafMats[hex]);
  m.castShadow=true; return m;
}

(function buildMontBlanc(){
  // tart base under the cream
  const base=new THREE.Mesh(new THREE.CylinderGeometry(MB_R-.15,MB_R+.05,1.0,40), M('#E0B87E',.9));
  base.position.y=.35; base.castShadow=true; base.receiveShadow=true; montblanc.add(base);
  const paper=new THREE.Mesh(lathe([[MB_R-.1,0],[MB_R+.22,.2],[MB_R+.42,.62],[MB_R+.3,1.02],[MB_R-.05,1.05]],48), M('#F6E2C4',.85,{side:THREE.DoubleSide}));
  paper.position.y=.02; montblanc.add(paper);

  // whipped cream dome under strands
  const dome=new THREE.Mesh(lathe([[0,3.55],[.9,3.4],[1.7,2.9],[2.3,2.1],[2.7,1.2],[2.9,.4],[2.95,-.5],[0,-.5]],36), M('#FFF7EA',.72));
  dome.position.y=1.0; dome.castShadow=true; montblanc.add(dome);

  // marron cream strands
  const strands=[];
  const LAYERS=[
    {count:40, rad:.10, cTop:.16, cBot:2.92, yTop:4.55, yBot:.12, turn:2.5},
    {count:30, rad:.085, cTop:.10, cBot:2.55, yTop:4.35, yBot:.9,  turn:-2.1}
  ];
  LAYERS.forEach((L,li)=>{
    for(let i=0;i<L.count;i++){
      const a0=(i/L.count)*TAU + rnd(-.06,.06);
      const pts=[];
      const steps=13;
      for(let s=0;s<=steps;s++){
        const t=s/steps;
        const r=lerp(L.cTop,L.cBot,Math.pow(t,.78))+Math.sin(t*9+i)*0.045;
        const y=lerp(L.yTop,L.yBot,Math.pow(t,1.12));
        const a=a0+t*L.turn;
        pts.push(new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r));
      }
      const curve=new THREE.CatmullRomCurve3(pts);
      strands.push({geo:new THREE.TubeGeometry(curve,20,L.rad,5,false)});
    }
  });
  const halfIdx=Math.floor(strands.length*0.55);
  const m1=new THREE.Mesh(mergeGeos(strands.slice(0,halfIdx)), M('#CF8E43',.72));
  const m2=new THREE.Mesh(mergeGeos(strands.slice(halfIdx)), M('#B87532',.74));
  [m1,m2].forEach(m=>{ m.position.y=1.0; m.castShadow=true; m.receiveShadow=true; montblanc.add(m); mbCreamMats.push(m.material); });

  // top ornament
  mbTopGroup=new THREE.Group(); mbTopGroup.position.y=5.45; montblanc.add(mbTopGroup);
  const swirl=new THREE.Mesh(lathe([[0,0],[.62,.05],[.55,.3],[.42,.45],[.44,.62],[.3,.78],[.3,.95],[.15,1.08],[0,1.14]],20), M('#FFFAF0',.6));
  swirl.castShadow=true; mbTopGroup.add(swirl);
  const glazed=new THREE.Mesh(KURI_GEO, M('#8F5A26',.34));
  glazed.position.y=1.06; glazed.scale.setScalar(1.15); glazed.castShadow=true; mbTopGroup.add(glazed);
  const sheen=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6), M('#FFF0CE',.2));
  sheen.position.set(-.14,1.6,.18); mbTopGroup.add(sheen);

  // little maple leaf decoration
  mbCrown=new THREE.Group(); mbCrown.position.y=4.1; montblanc.add(mbCrown);
  const leaf=makeLeafMesh('#D4502C'); leaf.scale.setScalar(.72);
  leaf.position.set(1.15,0,.6); leaf.rotation.set(-.5,.6,.3); mbCrown.add(leaf);
  const leaf2=makeLeafMesh('#EFA63C'); leaf2.scale.setScalar(.6);
  leaf2.position.set(-1.1,-.5,-.5); leaf2.rotation.set(-.4,-.9,-.35); mbCrown.add(leaf2);
})();

/* soft contact shadow blob under movers */
const blobTex=(function(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(80,45,60,.55)'); gr.addColorStop(.55,'rgba(80,45,60,.22)'); gr.addColorStop(1,'rgba(80,45,60,0)');
  x.fillStyle=gr; x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
})();
const blobMatProto=new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false,opacity:.85});
function makeBlob(size){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size), blobMatProto.clone());
  m.rotation.x=-Math.PI/2; m.position.y=.09; m.renderOrder=1; return m;
}
const playerBlob=makeBlob(1.7);

const lockRing=new THREE.Mesh(new THREE.TorusGeometry(.95,.075,8,30),

lockRing.rotation.x=-Math.PI/2; lockRing.position.y=.14; lockRing.renderOrder=3;
lockRing.visible=false; world.add(lockRing);
const lockTicks=new THREE.Group(); lockTicks.position.y=.15; lockTicks.visible=false;
(function(){
  const tickMat=new THREE.MeshBasicMaterial({color:C('#FF9A3C'),transparent:true,opacity:.95,depthWrite:false});
  const tickGeo=new THREE.ConeGeometry(.17,.34,3);
  for(let i=0;i<4;i++){

/* pre-merged spike ball geometry */
function spikeBallGeo(count,len,rad,coreR){
  const items=[];
  const cone=new THREE.ConeGeometry(rad,len,6);
  for(let i=0;i<count;i++){
    const y=1-(2*i+1)/count, r=Math.sqrt(Math.max(0,1-y*y));
    const ph=i*Math.PI*(3-Math.sqrt(5));
    const dir=new THREE.Vector3(Math.cos(ph)*r,y,Math.sin(ph)*r);
    const pos=dir.clone().multiplyScalar(coreR+len*.42);
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    items.push({geo:cone, matrix:new THREE.Matrix4().compose(pos,q,new THREE.Vector3(1,1,1))});
  }
  const g=mergeGeos(items); cone.dispose(); return g;
}
const SPIKE_GEO=spikeBallGeo(30,.52,.085,.52);
const SPIKE_GEO_BOSS=spikeBallGeo(46,1.25,.19,1.35);

function addFace(parent,y,z,sp,eyeScale){
  const s=eyeScale||1;
  const eL=new THREE.Mesh(GEO.eye,MAT.eye), eR=new THREE.Mesh(GEO.eye,MAT.eye);
  eL.position.set(-sp,y,z); eR.position.set(sp,y,z);
  eL.scale.setScalar(s); eR.scale.setScalar(s);
  const cL=new THREE.Mesh(GEO.sphereLo,MAT.cheek), cR=new THREE.Mesh(GEO.sphereLo,MAT.cheek);
  cL.position.set(-sp*1.75,y-.16*s,z*.94); cR.position.set(sp*1.75,y-.16*s,z*.94);
  cL.scale.set(.1*s,.07*s,.05*s); cR.scale.copy(cL.scale);
  parent.add(eL,eR,cL,cR);
}

const shots=[];
function throwKuri(charged){
  const big=!!charged;
  const sp0=big?21:25;
  const dir=player.aim.clone(); dir.y=0; dir.normalize();
  // lead the locked target a little so a walking enemy still gets hit
  const lk=player.lock;
  if(lk && !lk.dead && lk.state!=='fall'){
    const flight=lk.pos.distanceTo(player.pos)/sp0;
    const toCake=new THREE.Vector3(-lk.pos.x,0,-lk.pos.z);
    if(toCake.lengthSq()>.01) toCake.normalize().multiplyScalar(lk.def.speed*flight*.85);
    else toCake.set(0,0,0);
    const aimAt=lk.pos.clone().add(toCake).sub(player.pos); aimAt.y=0;
    if(aimAt.lengthSq()>.04) dir.copy(aimAt).normalize();
  }
  const m=new THREE.Mesh(KURI_GEO, big?KURI_MAT_BIG:KURI_MAT);
  m.scale.setScalar(big?1.25:.72); m.castShadow=true;
  const start=player.pos.clone().add(new THREE.Vector3(0,1.15,0)).add(dir.clone().multiplyScalar(.6));
  m.position.copy(start); world.add(m);
  const sp=big?21:25;
  shots.push({
    m, big, dmg:big?4:1, splash:big?3.1:0,
    p:start.clone(),
    v:new THREE.Vector3(dir.x*sp, big?5.0:3.6, dir.z*sp),
    life:2.4, spin:new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(10,16)),
    bounced:0
  });
  sfx.throw(big);
}

const sfx=(function(){
  let ctx=null, master=null, on=true;
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=.26; master.connect(ctx.destination);
  }
  function tone(f,f2,dur,type,vol,delay){
    if(!on||!ctx) return;
    const t0=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol===undefined?.5:vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.03);
  }
  function noise(dur,vol,hp){
    if(!on||!ctx) return;
    const len=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||700;
    const g=ctx.createGain(); g.gain.value=vol===undefined?.3:vol;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  return {
    init, get on(){return on;},
    toggle(){ on=!on; if(on) init(); return on; },
    throw(big){ noise(.09,big?.26:.15,900); tone(big?300:460,big?140:260,.16,'triangle',.22); },
    hit(){ tone(620,900,.08,'square',.14); noise(.05,.1,1400); },
    kill(){ tone(520,0,.09,'triangle',.2); tone(780,0,.1,'triangle',.18,.06); tone(1040,0,.16,'triangle',.15,.12); },
    boom(){ noise(.3,.4,240); tone(160,50,.35,'sawtooth',.2); },
    hurt(){ tone(260,90,.28,'sawtooth',.24); },
    mbHurt(){ tone(180,70,.3,'square',.16); noise(.14,.16,320); },
    pickup(){ tone(880,0,.08,'sine',.2); tone(1320,0,.14,'sine',.17,.06); },
    wave(){ tone(523,0,.14,'triangle',.2); tone(659,0,.14,'triangle',.2,.11); tone(784,0,.24,'triangle',.22,.22); },
    over(){ tone(392,0,.3,'triangle',.22); tone(330,0,.3,'triangle',.2,.2); tone(262,0,.6,'triangle',.22,.4); },
    charge(){ tone(300,900,.42,'sine',.1); }
  };
})();

/* ---- waves ---- */
function waveComposition(n){
  const list=[];
  const scale=1+Math.floor((n-1)/3)*0.28;
  if(n%5===0){
    list.push({type:'boss',scale:1+ (n/5-1)*0.55});
    for(let i=0;i<4+n;i++) list.push({type:'acorn',scale});
  } else {
    let acorn=3+Math.floor(n*1.15);
    let burr=n>=2?1+Math.floor(n*.62):0;
    let shroom=n>=4?Math.floor((n-2)*.42):0;
    let ghost=n>=3?1+Math.floor((n-2)*.55):0;
    for(let i=0;i<acorn;i++) list.push({type:'acorn',scale});
    for(let i=0;i<burr;i++) list.push({type:'burr',scale});
    for(let i=0;i<shroom;i++) list.push({type:'shroom',scale});
    for(let i=0;i<ghost;i++) list.push({type:'ghost',scale});
  }
  for(let i=list.length-1;i>0;i--){ const j=rint(0,i); const t=list[i]; list[i]=list[j]; list[j]=t; }
  return list;
}
function startWave(n){

   12. update
   ============================================================ */
const tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
const camRight=new THREE.Vector3(1,0,0), camFwd=new THREE.Vector3(0,0,-1);

function nearestEnemy(from,maxd){
  let bd=maxd*maxd, b=null;
  for(const e of enemies){
    if(e.dead||e.state==='fall') continue;
    const d=e.pos.distanceToSquared(from);
    if(d<bd){ bd=d; b=e; }
  }
  return b;
}

/* ---- aim assist -------------------------------------------------
   The raw stick/mouse direction only nominates a region; the assist
   snaps the character onto the best enemy inside that region and keeps
   it there (stickiness) so a target doesn't slip away mid-throw.      */
const rawAim=new THREE.Vector3(0,0,-1), aTmp=new THREE.Vector3(), aBest=new THREE.Vector3();
const ASSIST_CONE_MOUSE=1.15;   // ~66° either side of the cursor
const ASSIST_CONE_AUTO=2.70;    // keyboard / touch: nearly all around
function applyAimAssist(dt){
  const cone = usingMouse ? ASSIST_CONE_MOUSE : ASSIST_CONE_AUTO;
  let best=null, bestScore=Infinity;
  for(const e of enemies){
    if(e.dead||e.state==='fall') continue;
    aTmp.copy(e.pos).sub(player.pos); aTmp.y=0;
    const dist=aTmp.length();
    if(dist<.5||dist>30) continue;
    aTmp.divideScalar(dist);
    const ang=Math.acos(clamp(aTmp.dot(rawAim),-1,1));
    if(ang>cone) continue;
    let score=ang*2.4+dist*.035;
    if(player.lock===e) score-=.5;                    // stay locked on
    if(dist<MB_R+6) score-=.35;                       // prefer the ones reaching the cake
    if(score<bestScore){ bestScore=score; best=e; aBest.copy(aTmp); }
  }
  player.lock = best;
  const want = best ? aBest : rawAim;
  player.aim.lerp(want, Math.min(1, dt*20));
  if(player.aim.lengthSq()<1e-4) player.aim.copy(want);
  player.aim.y=0; player.aim.normalize();
}

function updatePlayer(dt){
  // movement input
  let mx=0,mz=0;
  if(keys['KeyW']||keys['ArrowUp']) mz-=1;
  if(keys['KeyS']||keys['ArrowDown']) mz+=1;
  if(keys['KeyA']||keys['ArrowLeft']) mx-=1;
  if(keys['KeyD']||keys['ArrowRight']) mx+=1;
  if(stick.active){ mx+=stick.x; mz+=stick.y; }
  tmp.set(mx,0,mz);
  if(tmp.lengthSq()>1) tmp.normalize();
  const SPEED=8.6;
  const accel=tmp.multiplyScalar(SPEED);
  player.vel.x=lerp(player.vel.x,accel.x,1-Math.pow(0.0009,dt));
  player.vel.z=lerp(player.vel.z,accel.z,1-Math.pow(0.0009,dt));
  player.pos.addScaledVector(player.vel,dt);

  // bounds
  const r=Math.hypot(player.pos.x,player.pos.z);
  if(r>PLAY_R){ const k=PLAY_R/r; player.pos.x*=k; player.pos.z*=k; player.vel.multiplyScalar(.5); }
  const rm=Math.hypot(player.pos.x,player.pos.z);
  if(rm<MB_R+.7){ const k=(MB_R+.7)/(rm||.001); player.pos.x*=k; player.pos.z*=k; }

  // aim — raw input first, then the assist decides what we actually face
  if(usingMouse){
    ray.setFromCamera(pointer,camera);
    if(ray.ray.intersectPlane(aimPlane,tmp2)){
      tmp2.sub(player.pos).setY(0);
      if(tmp2.lengthSq()>.04) rawAim.copy(tmp2).normalize();
    }
  } else if(mx*mx+mz*mz>0.01){
    rawAim.set(mx,0,mz).normalize();
  }
  applyAimAssist(dt);
  const targetFace=Math.atan2(player.aim.x,player.aim.z);
  let diff=targetFace-player.face;
  while(diff>Math.PI) diff-=TAU; while(diff<-Math.PI) diff+=TAU;
  player.face+=diff*Math.min(1,dt*16);

  // ammo regen
  const regen = player.rapid>0 ? 4.2 : 1.85;
  if(player.ammo<6){ player.ammo=Math.min(6, player.ammo+regen*dt); }
  if(player.cd>0) player.cd-=dt;
  if(player.inv>0) player.inv-=dt;
  if(player.rapid>0) player.rapid-=dt;
  if(player.hurtFlash>0) player.hurtFlash-=dt;
  if(player.throwT>0) player.throwT-=dt;

  // charging
  if(charging){
    chargeT+=dt;
    const p=clamp(chargeT/CHARGE_TIME,0,1);
    if(!document.body.classList.contains('touch')){
      const sp=player.pos.clone().setY(1.6).project(camera);
      ui.chargeRing.style.left=((sp.x*.5+.5)*innerWidth)+'px';
      ui.chargeRing.style.top=((-sp.y*.5+.5)*innerHeight)+'px';
    }
    ui.chargeRing.style.opacity = p>.06?'1':'0';
    ui.chargeArc.setAttribute('stroke-dashoffset', String(188.5*(1-p)));
    ui.chargeArc.setAttribute('stroke', p>=1?'#F2C24E':'#F2853C');
    if(p>=1&&!chargedSoundPlayed){ chargedSoundPlayed=true; sfx.charge(); }
  }

  // visuals
  const speed=Math.hypot(player.vel.x,player.vel.z);
  player.walk+=dt*speed*1.55;
  const bob=Math.sin(player.walk*2)*0.055*clamp(speed/6,0,1);
  player.g.position.set(player.pos.x, player.pos.y, player.pos.z);
  player.g.rotation.y=player.face;
  pBody.position.y=bob;
  pBody.rotation.z=Math.sin(player.walk)*0.035*clamp(speed/6,0,1);
  pHead.rotation.z=Math.sin(player.walk*2+.5)*0.04;
  pHead.position.y=1.42+Math.sin(player.walk*2+1)*0.018;
  pLegL.position.z=Math.sin(player.walk)*0.22*clamp(speed/5,0,1);
  pLegR.position.z=-Math.sin(player.walk)*0.22*clamp(speed/5,0,1);
  pLegL.position.y=Math.max(0,Math.sin(player.walk)*0.12);
  pLegR.position.y=Math.max(0,-Math.sin(player.walk)*0.12);
  pScarfEnd.rotation.x=-0.25-Math.sin(player.walk*2)*0.22-speed*0.03;

  const thr=clamp(player.throwT/.24,0,1);
  const chargeLean = charging? clamp(chargeT/CHARGE_TIME,0,1)*0.5 : 0;
  pArmR.rotation.x = -2.3*thr + chargeLean*1.5 + Math.cos(player.walk)*0.18*clamp(speed/6,0,1)*(1-thr);
  pArmL.rotation.x = -Math.cos(player.walk)*0.18*clamp(speed/6,0,1);
  pBody.scale.set(1+thr*0.08,1-thr*0.09,1+thr*0.08);
  pHeldKuri.visible = player.ammo>=1;
  pHeldKuri.scale.setScalar(.52*(1+chargeLean*.5));

  // hurt blink
  const blink = player.inv>0 && Math.floor(player.inv*14)%2===0;
  player.g.visible=!blink;

  playerBlob.position.set(player.pos.x,.09,player.pos.z);
  playerBlob.material.opacity=.8;

  // aiming aids
  const lk=player.lock;
  if(lk && !lk.dead){
    const s=(lk.def.r+.5)/.95;
    const pulse=1+Math.sin(G.time*8)*.05;
    lockRing.visible=true; lockTicks.visible=true;
    lockRing.position.set(lk.pos.x,.14,lk.pos.z); lockRing.scale.setScalar(s*pulse);
    lockTicks.position.set(lk.pos.x,.15,lk.pos.z); lockTicks.scale.setScalar(s*pulse);
    lockTicks.rotation.y+=dt*1.1;
  } else { lockRing.visible=false; lockTicks.visible=false; }
  for(let i=0;i<aimDots.length;i++){
    const d=aimDots[i], gap=1.45+i*.92;
    d.visible=true;
    d.position.set(player.pos.x+player.aim.x*gap, .13, player.pos.z+player.aim.z*gap);
    d.material.opacity=(.6-i*.085)*(charging?1:.62);
  }
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){
      e.t+=dt;
      const k=1-e.t/.32;
      e.g.scale.setScalar(Math.max(0.001,k*1.2));
      e.g.rotation.y+=dt*10;
      e.g.position.y=e.y+ (1-k)*1.5;
      e.blob.material.opacity=Math.max(0,k*.8);
      if(e.t>.32){ world.remove(e.g); world.remove(e.blob); enemies.splice(i,1); }
      continue;
    }
    const def=e.def;

    if(e.state==='fall'){
      e.vy-=52*dt; e.y+=e.vy*dt;
      if(e.y<=0){ e.y=0; e.vy=0; e.state='walk'; e.squash=1;
        burst(e.pos.clone().setY(.15),7,'cream',5,.55);
        G.shake=Math.max(G.shake,.1);
      }
      e.g.position.set(e.pos.x,e.y,e.pos.z);
      e.g.rotation.y+=dt*3;
      const sq=1+clamp(-e.vy/42,0,.5);
      e.g.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
      e.blob.position.set(e.pos.x,.1,e.pos.z);
      e.blob.scale.setScalar(clamp(1-e.y/16,.25,1));
      e.blob.material.opacity=.7;
      continue;
    }

    // move toward Mont Blanc
    tmp.set(-e.pos.x,0,-e.pos.z);
    const dist=tmp.length();
    tmp.normalize();
    const stopAt=MB_R+def.r+.25;
    let moving=true;
    if(dist>stopAt){
      let sp=def.speed;
      if(e.type==='ghost') { // zigzag
        const side=new THREE.Vector3(-tmp.z,0,tmp.x).multiplyScalar(Math.sin(G.time*2.4+e.bob)*.55);
        tmp.add(side).normalize();
      }
      // avoid stacking
      for(const o of enemies){
        if(o===e||o.dead||o.state==='fall') continue;
        const dx=e.pos.x-o.pos.x, dz=e.pos.z-o.pos.z;
        const dd=dx*dx+dz*dz, minD=(def.r+o.def.r)*.92;
        if(dd<minD*minD && dd>0.0001){
          const d=Math.sqrt(dd);
          tmp.x+=(dx/d)*.75; tmp.z+=(dz/d)*.75;
        }
      }
      tmp.normalize();
      e.pos.addScaledVector(tmp, sp*dt);
      e.atkT=Math.min(e.atkT,.5);
    } else {
      moving=false;
      e.atkT-=dt;
      if(e.atkT<=0){
        e.atkT=def.atk;
        e.lunge=1;
        damageMB(def.dmg);
        if(e.type==='boss'&&G.state==='play'){
          for(let k=0;k<2;k++) spawnEnemy('acorn',1+G.wave*.06, rnd(0,TAU), rnd(8,12));
        }
      }
    }

    // mushroom spores
    if(e.type==='shroom'){
      e.shootT-=dt;
      if(e.shootT<=0 && dist<20){
        e.shootT=rnd(2.6,4.2);
        const dir=player.pos.clone().sub(e.pos).setY(0).normalize();
        spores.push({
          p:e.pos.clone().setY(1.25), v:dir.multiplyScalar(9).setY(2.6), life:3,
          m:(function(){ const m=new THREE.Mesh(GEO.sphereLo, M('#C9D88A',.6,{emissive:C('#4A6B22'),emissiveIntensity:.3}));
            m.scale.setScalar(.22); world.add(m); return m; })()
        });
      }
    }

    // contact damage to player
    const dp=e.pos.distanceTo(player.pos);
    if(dp < def.r+.62){ hurtPlayer(1,e.pos); }

    // visuals
    e.bob+=dt;
    e.squash=Math.max(0,e.squash-dt*4);
    e.hit=Math.max(0,e.hit-dt*5);
    let y=0;
    if(e.type==='acorn'||e.type==='burr'){
      const hop=Math.abs(Math.sin(G.time*(e.type==='acorn'?7:5)+e.bob*3));
      y = moving? hop*(e.type==='acorn'?.42:.22) : 0;
    } else if(e.type==='ghost'){
      y=1.0+Math.sin(G.time*2.6+e.bob*4)*.35;
      e.g.rotation.z=Math.sin(G.time*2+e.bob)*.3;
      e.g.rotation.x=Math.sin(G.time*1.6+e.bob)*.2;
    } else if(e.type==='shroom'){
      y=Math.abs(Math.sin(G.time*3+e.bob*3))*.12;
    } else if(e.type==='boss'){
      y=Math.abs(Math.sin(G.time*3.2+e.bob))*.2;
    }
    e.y=y;
    e.g.position.set(e.pos.x,y,e.pos.z);
    if(e.type!=='ghost'){
      const face=Math.atan2(-e.pos.x,-e.pos.z);
      let d2=face-e.g.rotation.y; while(d2>Math.PI)d2-=TAU; while(d2<-Math.PI)d2+=TAU;
      e.g.rotation.y+=d2*Math.min(1,dt*7);
    } else {
      e.g.rotation.y=Math.atan2(-e.pos.x,-e.pos.z);
    }
    const lung=e.lunge?e.lunge:0;
    if(e.lunge) e.lunge=Math.max(0,e.lunge-dt*4);
    const sq=1+e.squash*.35+lung*.2, hitS=1+e.hit*.28;
    e.g.scale.set((1/Math.sqrt(sq))*hitS, sq*hitS, (1/Math.sqrt(sq))*hitS);
    e.blob.position.set(e.pos.x,.1,e.pos.z);
    e.blob.scale.setScalar(clamp(1-y*.28,.5,1));
    e.blob.material.opacity=.75;
  }
}

/* mushroom spores */
const spores=[];
function updateSpores(dt){
  for(let i=spores.length-1;i>=0;i--){
    const s=spores[i];
    s.v.y-=16*dt;
    s.p.addScaledVector(s.v,dt);
    s.m.position.copy(s.p);
    s.m.rotation.x+=dt*6; s.m.rotation.y+=dt*5;
    s.life-=dt;
    let gone=s.life<=0||s.p.y<.1;
    if(!gone && s.p.distanceTo(player.pos.clone().setY(.9))<.85){ hurtPlayer(1,s.p); gone=true; }
    if(gone){
      burst(s.p.clone(),5,'green',4,.5);
      world.remove(s.m); spores.splice(i,1);
    }
  }
}

function killEnemy(e){
  e.dead=true; e.t=0;
  G.kills++;
  G.combo++; G.comboT=2.2;
  const mult=1+Math.min(G.combo-1,9)*0.1;
  G.score+=Math.round(e.def.score*mult);
  popText(e.pos.clone().setY(e.y+1.5), '+'+Math.round(e.def.score*mult), G.combo>3?'#FFD98A':'#FFF3DC');
  const col = e.type==='burr'||e.type==='boss' ? 'green' : e.type==='ghost' ? 'leaf' : e.type==='shroom' ? 'red' : 'brown';
  burst(e.pos.clone().setY(e.y+.5), e.type==='boss'?36:13, col, e.type==='boss'?11:7, e.type==='boss'?1.5:1);
  burst(e.pos.clone().setY(e.y+.5), 6, 'cream', 6, .8);
  if(e.type==='boss'){ sfx.boom(); G.shake=.9; banner('げきは！','イガグリ大王をたおした'); }
  else sfx.kill();
  const roll=Math.random();
  if(e.type==='boss'){ spawnPickup(e.pos.clone(),'gold'); spawnPickup(e.pos.clone().add(new THREE.Vector3(1.6,0,0)),'cream'); }
  else if(roll<0.055) spawnPickup(e.pos.clone(),'gold');
  else if(roll<0.17) spawnPickup(e.pos.clone(),'cream');
  syncHUD();
}

function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.v.y-=30*dt;
    s.p.addScaledVector(s.v,dt);
    s.m.position.copy(s.p);
    s.m.rotation.x+=s.spin.x*dt; s.m.rotation.y+=s.spin.y*dt; s.m.rotation.z+=s.spin.z*dt;
    s.life-=dt;

    let hitSomething=false;
    for(const e of enemies){
      if(e.dead||e.state==='fall') continue;
      const dx=s.p.x-e.pos.x, dz=s.p.z-e.pos.z;
      const rr=e.def.r+(s.big?.65:.35);
      if(dx*dx+dz*dz < rr*rr && s.p.y < e.y+e.def.h+.5 && s.p.y > e.y-.4){
        hitSomething=true;
        applyDamage(e,s.dmg,s.p);
        if(s.splash>0){
          for(const o of enemies){
            if(o===e||o.dead||o.state==='fall') continue;
            if(o.pos.distanceTo(s.p)<s.splash) applyDamage(o,2,s.p);
          }
          burst(s.p.clone(),20,'cream',10,1.3);
          burst(s.p.clone(),10,'gold',9,.9);
          G.shake=Math.max(G.shake,.3);
          sfx.boom();
        }
        break;
      }
    }
    if(hitSomething || s.life<=0 || s.p.y<.14){
      if(!hitSomething && s.p.y<.14 && s.bounced<1 && s.life>0){
        s.bounced++; s.p.y=.14; s.v.y=Math.abs(s.v.y)*.42; s.v.x*=.6; s.v.z*=.6;
        burst(s.p.clone(),3,'cream',3,.45);
        continue;
      }
      burst(s.p.clone(), s.big?14:5, s.big?'gold':'marron', s.big?8:4.5, s.big?1:.6);
      world.remove(s.m); shots.splice(i,1);
    }
  }
}
function applyDamage(e,d,at){
  e.hp-=d; e.hit=1;
  burst(at.clone(),4,'cream',5,.5);
  sfx.hit();
  if(e.hp<=0) killEnemy(e);
  else { // knockback
    const k=e.pos.clone().sub(at).setY(0).normalize().multiplyScalar(.28);
    e.pos.add(k);
  }
}

function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.t+=dt; p.life-=dt;
    p.g.position.y=.35+Math.sin(p.t*3.4)*.16;
    p.g.rotation.y+=dt*1.8;
    if(p.life<2.5) p.g.visible=Math.floor(p.life*8)%2===0;
    const d=p.g.position.distanceTo(player.pos);
    if(d<1.5){
      if(p.kind==='cream'){ G.mbHP=Math.min(G.mbMax,G.mbHP+12); popText(p.g.position.clone(),'+12','#FFE0B8'); }
      else { player.rapid=7; player.ammo=6; popText(p.g.position.clone(),'RAPID!','#FFD25E'); }
      burst(p.g.position.clone(),10,p.kind==='cream'?'cream':'gold',6,.8);
      sfx.pickup(); syncHUD();
      world.remove(p.g); pickups.splice(i,1); continue;
    }
    if(p.life<=0){ world.remove(p.g); pickups.splice(i,1); }
  }
}

function updateParticles(dt){
  for(const p of particles){
    if(p.life<=0){ if(p.m.visible) p.m.visible=false; continue; }
    p.life-=dt;
    p.v.y+=p.g*dt;
    p.m.position.addScaledVector(p.v,dt);
    if(p.m.position.y<.08){ p.m.position.y=.08; p.v.y*=-.35; p.v.x*=.7; p.v.z*=.7; }
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt;
    const k=clamp(p.life/p.max,0,1);
    p.m.material.opacity=k;
    if(p.life<=0) p.m.visible=false;
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.life-=dt;
    p.s.position.y+=dt*2.1;
    const k=clamp(p.life/p.max,0,1);
    p.s.material.opacity=k<.35?k/.35:1;
    p.s.scale.set(2.4*(1+(1-k)*.25),.9*(1+(1-k)*.25),1);
    if(p.life<=0){ world.remove(p.s); p.s.material.map.dispose(); p.s.material.dispose(); popups.splice(i,1); }
  }
}

function updateAmbient(dt){
  for(const a of ambient){
    a.m.position.y-=a.vy*dt;
    a.m.position.x+=Math.sin(G.time*a.sp+a.ph)*dt*1.3;
    a.m.rotation.z+=a.rz*dt; a.m.rotation.x+=dt*.7;
    if(a.m.position.y<-2.5){
      a.m.position.set(rnd(-26,26), rnd(18,26), rnd(-26,26));
    }
  }
  for(const c of clouds){
    c.rotation.y+=c.userData.spin*dt*6;
    if(c.userData.bob!==undefined) c.position.y+=Math.sin(G.time*.5+c.userData.bob)*dt*.35;
  }
  // mont blanc idle
  const hpK=clamp(G.mbHP/G.mbMax,0,1);
  montblanc.scale.y=lerp(montblanc.scale.y, .74+hpK*.26, 1-Math.pow(.01,dt));
  montblanc.scale.x=montblanc.scale.z=lerp(montblanc.scale.x, 1+(1-hpK)*.07, 1-Math.pow(.01,dt));
  mbTopGroup.rotation.y+=dt*.35;
  mbCrown.rotation.y-=dt*.22;
  const flash=G.flash>0?G.flash/.22:0;
  for(const m of mbCreamMats){
    m.emissive.setRGB(flash*.55,flash*.12,flash*.1);
  }
  if(G.flash>0) G.flash-=dt;
}

function updateWaves(dt){
  if(G.breather>0){
    G.breather-=dt;
    if(G.breather<=0) startWave(G.wave+1);
    return;
  }
  if(G.toSpawn.length>0){
    G.spawnT-=dt;
    if(G.spawnT<=0){
      const item=G.toSpawn.shift();
      spawnEnemy(item.type,item.scale);
      const bossWave=G.wave%5===0;
      G.spawnT = bossWave?rnd(.5,.9):rnd(.32,.78);
    }
  } else if(enemies.length===0){
    G.breather=3.2;
    banner('WAVE '+G.wave+' クリア!','つぎが やってくる…');
    sfx.kill();
  }
}

/* ============================================================
   13. loop
   ============================================================ */
let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,1/25);
  G.time+=dt;

  if(G.state==='play'){
    updatePlayer(dt);
    updateWaves(dt);
    updateEnemies(dt);
    updateShots(dt);
    updateSpores(dt);
    updatePickups(dt);
    if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0&&G.combo>0){ G.combo=0; syncHUD(); } }
    syncHUDThrottled();
  } else if(G.state==='title'||G.state==='over'){
    // idle showcase: gentle orbit
    player.g.rotation.y+=dt*.5;
    updateEnemies(dt*(G.state==='over'?.25:1));
    updateShots(dt);
  }
  updateParticles(dt);
  updateAmbient(dt);

  // camera
  const lookX = player.pos.x*0.13, lookZ=player.pos.z*0.10;
  camTarget.lerp(tmp2.set(lookX, 2.0, lookZ), 1-Math.pow(.02,dt));
  let orbit=0;
  if(G.state==='title') orbit=Math.sin(G.time*.13)*0.42;
  const dir=CAM_DIR.clone().applyAxisAngle(new THREE.Vector3(0,1,0), orbit);
  camera.position.copy(camTarget).addScaledVector(dir, camDist);
  if(G.shake>0){
    G.shake=Math.max(0,G.shake-dt*2.2);
    const s=G.shake*(REDUCED?.25:1);
    camera.position.x+=rnd(-1,1)*s*.65;
    camera.position.y+=rnd(-1,1)*s*.5;
  }
  camera.lookAt(camTarget);
  sun.target.position.set(player.pos.x*.3,0,player.pos.z*.3);

  renderer.render(scene,camera);
}

let hudT=0;
function syncHUDThrottled(){
  hudT++;
  if(hudT%4===0) syncHUD();
}

/* ============================================================
   14. boot
   ============================================================ */
fitCamera();
// idle demo enemies on the title screen
function titleDemo(){
  for(let i=0;i<4;i++) spawnEnemy(pick(['acorn','burr','ghost','shroom']),1,rnd(0,TAU),rnd(7,11));
}
titleDemo();
syncHUD();
requestAnimationFrame(tick);

// hide loader after fonts/first frame
function done(){ const l=el('loading'); if(l){ l.style.transition='opacity .45s'; l.style.opacity='0'; setTimeout(()=>l.remove(),500);} }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setTimeout(done,180)); else setTimeout(done,600);
setTimeout(done,2600);

// keep state across live updates
try{
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(()=>({score:G.score,wave:G.wave,best:best}));
  }
}catch(e){}
})();
</script>
